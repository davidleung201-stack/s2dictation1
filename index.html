<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6b4f2a">
<title>《愚公移山》背默大挑戰</title>
<style>
  :root{
    --ink:#3b2f1e;--red:#8b1a1a;--gold:#b08d57;--paper:#fffaf0;--sand:#f7efdc;
    --scale:1;
    --fs:calc(clamp(1.05rem,4.3vw,1.4rem) * var(--scale));
    --tabh:60px;
  }
  html{-webkit-text-size-adjust:100%}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Noto Serif TC","PMingLiU","Microsoft JhengHei",serif;background:#f4ecd8;color:var(--ink);min-height:100vh;touch-action:manipulation}
  button{font-family:inherit;color:inherit;user-select:none;-webkit-user-select:none;cursor:pointer}
  .app{max-width:900px;margin:0 auto;background:var(--paper);min-height:100vh}
  @media(min-width:700px){
    body{padding:12px}
    .app{border:2px solid var(--gold);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.15);overflow:hidden;min-height:auto}
  }
  header{background:linear-gradient(135deg,#6b4f2a,#a0763d);color:#fff;text-align:center;padding:12px 56px;position:relative}
  header h1{font-size:clamp(1.15rem,5vw,1.7rem);letter-spacing:3px}
  header p{opacity:.85;font-size:clamp(.78rem,3.2vw,.95rem);margin-top:3px}
  #fontBtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);color:#fff;font-size:1.1rem;font-weight:bold}
  #fontBtn:active{background:rgba(255,255,255,.35)}

  /* 分頁列 */
  .tabs{position:sticky;top:0;z-index:20;display:flex;background:#e9dcc0;border-bottom:2px solid var(--gold);height:var(--tabh)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:#5a4426;font-size:clamp(.72rem,3.1vw,.95rem);transition:.15s;border-bottom:3px solid transparent}
  .tab .ic{font-size:1.45em;line-height:1}
  .tab.active{background:var(--paper);font-weight:bold;color:var(--red);border-bottom-color:var(--red)}
  .tab:active{background:#dccba6}

  .panel{display:none;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .panel.active{display:block}

  /* 選項列（可橫向捲動） */
  .row{display:flex;gap:8px;align-items:center;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  .row label{font-weight:bold;color:#6b4f2a;white-space:nowrap;font-size:.95rem}
  .row.wrap{flex-wrap:wrap;overflow:visible}
  .chips{display:flex;gap:8px}
  .chip{padding:0 16px;min-height:42px;border:1.5px solid var(--gold);background:#fff;border-radius:22px;font-size:clamp(.9rem,3.6vw,1rem);white-space:nowrap;transition:.15s}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red)}
  .chip:active{transform:scale(.95)}

  .btn{flex:1;min-height:48px;padding:0 16px;border:none;border-radius:10px;font-size:clamp(.95rem,3.8vw,1.05rem);background:var(--red);color:#fff;transition:.12s;white-space:nowrap}
  .btn:active{transform:scale(.96);filter:brightness(1.15)}
  .btn.sec{background:var(--gold)}
  .btn.ghost{background:#ebe6dc;color:#444}
  .btn.auto{flex:0 0 auto}

  .textbox{background:#fff;border:1.5px solid #d9c7a3;border-radius:12px;padding:14px;font-size:var(--fs);line-height:2.2;letter-spacing:1px;min-height:100px}
  .hint{font-size:clamp(.82rem,3.3vw,.92rem);color:#7a6a50;margin:6px 0 10px;line-height:1.5}
  .title{font-weight:bold;color:var(--red);margin:6px 0 8px;font-size:clamp(.95rem,3.8vw,1.1rem)}

  /* 讀課文 */
  .clause{border-radius:5px;padding:3px 3px;transition:.2s;cursor:pointer}
  .clause.cover{background:var(--ink);color:var(--ink)}
  .clause:active{opacity:.7}

  /* 填空 */
  .blank{display:inline-block;min-width:1.5em;height:1.75em;line-height:1.75em;text-align:center;border-bottom:2.5px solid var(--red);margin:0 3px;vertical-align:bottom;color:#1a4d8b;background:#fff8e8;border-radius:4px 4px 0 0;cursor:pointer}
  .blank.sel{background:#ffe9a8;outline:2.5px solid #e0a800}
  .blank.ok{color:#1b7a2f;background:#e4f7e8;border-color:#1b7a2f}
  .blank.bad{color:#c00;background:#fde3e3;border-color:#c00;text-decoration:line-through}
  .dock{position:sticky;bottom:0;z-index:15;background:rgba(255,250,240,.98);border-top:2px solid var(--gold);margin:12px -14px calc(-14px - env(safe-area-inset-bottom));padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.08)}
  .pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px;background:var(--sand);border-radius:10px;min-height:60px;max-height:34vh;overflow-y:auto}
  .tile{width:clamp(46px,11.5vw,58px);height:clamp(46px,11.5vw,58px);border:1.5px solid var(--gold);background:#fff;border-radius:10px;font-size:clamp(1.25rem,5.2vw,1.6rem);box-shadow:0 2px 0 var(--gold);transition:.1s}
  .tile:active{transform:translateY(2px);box-shadow:none;background:#fff3d6}
  .tile.used{visibility:hidden}
  .tile.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* 排序 */
  .answer{position:sticky;top:calc(var(--tabh) + 6px);z-index:10;max-height:38vh;overflow-y:auto;line-height:2;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .answer .done{color:#1b7a2f}
  .cpool{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .ctile{width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--gold);background:#fff;border-radius:10px;font-size:var(--fs);line-height:1.6;box-shadow:0 2px 0 var(--gold);text-align:left;transition:.1s}
  .ctile:active{transform:translateY(2px);box-shadow:none;background:#fff3d6}
  .ctile.shake{animation:shake .4s;border-color:#c00;background:#fde3e3}

  /* 背默 */
  textarea{width:100%;min-height:40vh;font-family:inherit;font-size:max(16px,var(--fs));line-height:1.9;padding:12px;border:1.5px solid #d9c7a3;border-radius:12px;resize:vertical;background:#fff;color:var(--ink)}
  textarea:focus{outline:2px solid var(--gold)}
  .ok{color:#1b7a2f}
  .miss{color:#c00;background:#fde3e3;border-bottom:2px solid #c00;font-weight:bold}
  .extra{color:#d97706;text-decoration:line-through;background:#fff3d6}
  .pu{color:#999}
  .result{margin-top:14px;padding:14px;border-radius:12px;background:var(--sand);border-left:5px solid var(--gold);font-size:clamp(.95rem,3.8vw,1.05rem);line-height:1.7}
  .result.great{background:#e4f7e8;border-left-color:#1b7a2f}
  .big{font-size:1.6em;font-weight:bold;color:var(--red)}
  .legend{display:flex;gap:10px 16px;flex-wrap:wrap;font-size:clamp(.8rem,3.2vw,.9rem);margin-top:10px}

  /* 進度 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
  .card{background:#fff;border:1.5px solid #d9c7a3;border-radius:12px;padding:14px}
  .card h3{color:var(--red);font-size:1.05rem;margin-bottom:8px;border-bottom:1px dashed #d9c7a3;padding-bottom:6px}
  .card div{display:flex;justify-content:space-between;padding:5px 0;font-size:.95rem}
  .stars{color:#e0a800;letter-spacing:1px}

  .confetti{position:fixed;top:-30px;font-size:26px;animation:fall 2.6s linear forwards;pointer-events:none;z-index:99}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  footer{text-align:center;font-size:.78rem;color:#8a7a60;padding:12px 10px calc(12px + env(safe-area-inset-bottom))}

  /* 只有滑鼠裝置才顯示 hover 效果 */
  @media(hover:hover){
    .tab:hover{background:#dccba6}
    .chip:hover{background:#f3e7cf}
    .btn:hover{filter:brightness(1.1)}
    .clause:hover{background:#f3e7cf}
    .clause.cover:hover{background:#5a4426;color:#5a4426}
    .tile:hover,.ctile:hover{background:#fff3d6}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>《愚公移山》背默大挑戰</h1>
    <p>《列子‧湯問》　子子孫孫，無窮匱也</p>
    <button id="fontBtn" title="調整字體大小" aria-label="調整字體大小">字</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="read"><span class="ic">📖</span>讀課文</button>
    <button class="tab" data-tab="cloze"><span class="ic">✏️</span>填空</button>
    <button class="tab" data-tab="order"><span class="ic">🔀</span>排序</button>
    <button class="tab" data-tab="recite"><span class="ic">📝</span>背默</button>
    <button class="tab" data-tab="progress"><span class="ic">📊</span>進度</button>
  </nav>

  <!-- 讀課文 -->
  <section id="read" class="panel active">
    <div class="row"><label>段落</label><span class="chips" id="readParas"></span></div>
    <p class="hint">💡 點一句便會遮蓋，再點一下重新顯示。遮蓋後試試自己背出來！</p>
    <div class="row">
      <button class="btn sec" id="coverAll">全部遮蓋</button>
      <button class="btn ghost" id="showAll">全部顯示</button>
    </div>
    <div class="title" id="readTitle"></div>
    <div class="textbox" id="readText"></div>
  </section>

  <!-- 填空 -->
  <section id="cloze" class="panel">
    <div class="row"><label>段落</label><span class="chips" id="clozeParas"></span></div>
    <div class="row"><label>難度</label><span class="chips" id="clozeLevels"></span></div>
    <p class="hint">💡 點字卡填入空格（自動填入第一個空格；亦可先點某個空格）。點已填的空格可取回字卡。字卡中有「陷阱字」！</p>
    <div class="title" id="clozeTitle"></div>
    <div class="textbox" id="clozeText"></div>
    <div id="clozeResult"></div>
    <div class="dock">
      <div class="pool" id="clozePool"></div>
      <div class="row" style="margin:10px 0 0">
        <button class="btn" id="checkCloze">✅ 檢查</button>
        <button class="btn ghost" id="revealCloze">顯示答案</button>
        <button class="btn sec" id="newCloze">🎲 新題</button>
      </div>
    </div>
  </section>

  <!-- 排序 -->
  <section id="order" class="panel">
    <div class="row"><label>段落</label><span class="chips" id="orderParas"></span>
      <button class="btn sec auto" id="newOrder">🎲 重新打亂</button></div>
    <p class="hint">💡 句子已被打亂，請按原文次序逐句點選。點錯會記錄一次。</p>
    <div class="title" id="orderTitle"></div>
    <div class="textbox answer" id="orderAnswer"><span style="color:#aaa">（按次序點選下方句子…）</span></div>
    <div class="cpool" id="orderPool"></div>
    <div id="orderResult"></div>
  </section>

  <!-- 背默 -->
  <section id="recite" class="panel">
    <div class="row"><label>範圍</label><span class="chips" id="reciteParas"></span></div>
    <div class="row">
      <button class="btn sec" id="toggleHint">💡 顯示每句首字提示</button>
    </div>
    <div class="textbox" id="reciteHint" style="display:none;font-size:calc(var(--fs)*.85);color:#7a6a50;line-height:1.9"></div>
    <div class="title" id="reciteTitle"></div>
    <textarea id="reciteInput" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="請在此背默課文…（標點、空格不計分，可寫可不寫）"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="submitRecite">📝 提交比對</button>
      <button class="btn ghost" id="clearRecite">清除</button>
    </div>
    <div id="reciteResult"></div>
  </section>

  <!-- 進度 -->
  <section id="progress" class="panel">
    <p class="hint">此頁只記錄各模式的最佳成績，資料只儲存在你這部裝置內，不會上傳。</p>
    <div class="legend"><span>★★★ 90分以上</span><span>★★ 70分以上</span><span>★ 50分以上</span><span>☆ 未達50／未嘗試</span></div>
    <br>
    <div class="cards" id="progressCards"></div>
    <br>
    <div class="row"><button class="btn ghost" id="resetProgress">重設所有紀錄</button></div>
  </section>

  <footer>《愚公移山》背默練習遊戲　｜　自我評估用，不收集任何個人資料</footer>
</div>

<script>
/* ---------- 課文資料 ---------- */
const PARAS = [
"太形、王屋二山，方七百里，高萬仞，本在冀州之南，河陽之北。北山 愚公者，年且九十，面山而居。懲山北之塞，出入之迂也，聚室而謀，曰︰「吾與汝畢力平險，指通豫南，達於漢陰，可乎？」雜然相許。",
"其妻疑之，曰：「以君之力，曾不能損魁父之丘，如太形、王屋何？且焉置土石？」雜曰：「投諸渤海之尾，隱土之北。」遂率子孫，荷擔者三夫，叩石墾壤，以箕畚運於渤海之尾。鄰人京城氏之孀妻有遺男，始齔，跳往助之。寒暑易節，始一反焉。",
"河曲智叟笑而止之，曰：「甚矣，汝之不惠！以殘年餘力，曾不能毀山之一毛，其如土石何？」北山 愚公長歎曰：「汝心之固，固不可徹，曾不若孀妻、弱子！我雖死，有子存焉；子又生孫，孫又生子；子又有子，子又有孫；子子孫孫，無窮匱也；而山不加增，何苦而不平？」河曲 智叟亡以應。",
"操蛇之神聞之，懼其不已也，告之於帝。帝感其誠，命夸娥氏二子負二山，一厝朔東，一厝雍南。自是，冀之南，漢之陰，無隴斷焉。"
];
const TITLES = ["第一段　二山與愚公之志","第二段　妻疑與移山之行","第三段　智叟之笑與愚公之答","第四段　帝感其誠"];
const PNAMES = ['第一段','第二段','第三段','第四段'];
const LEVELS = [{name:"初級",r:0.25},{name:"中級",r:0.45},{name:"高級",r:0.65},{name:"挑戰",r:0.85}];

const PUNCT_RE = /[，。、；：︰？！「」\s]/;
const isPunct = c => PUNCT_RE.test(c);
const strip = s => [...s].filter(c=>!isPunct(c)).join('');
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function clauses(text){
  const parts = text.match(/[^，。；：︰？！]+(?:[，。；：︰？！]+」?)?/g) || [];
  const out = [];
  for(let i=0;i<parts.length;i++){
    let p = parts[i];
    while(strip(p).length<=2 && i+1<parts.length){ p += parts[++i]; }
    out.push(p);
  }
  return out;
}
const scrollTo_ = el => setTimeout(()=>el&&el.scrollIntoView({behavior:'smooth',block:'center'}),60);

/* ---------- 字體大小 ---------- */
const SCALES=[1,1.18,1.36];
let scaleIdx=+(localStorage.getItem('ygys_scale')||0);
function applyScale(){document.documentElement.style.setProperty('--scale',SCALES[scaleIdx]);}
document.getElementById('fontBtn').onclick=()=>{scaleIdx=(scaleIdx+1)%SCALES.length;applyScale();try{localStorage.setItem('ygys_scale',scaleIdx);}catch(e){}};
applyScale();

/* ---------- 進度儲存（僅本機） ---------- */
let progress = {};
try{ progress = JSON.parse(localStorage.getItem('ygys_progress')||'{}'); }catch(e){}
function saveScore(key,score){
  if(!(key in progress) || score>progress[key]) progress[key]=score;
  try{ localStorage.setItem('ygys_progress',JSON.stringify(progress)); }catch(e){}
}
function stars(s){ if(s===undefined) return '☆'; if(s>=90) return '★★★'; if(s>=70) return '★★'; if(s>=50) return '★'; return '☆'; }

function celebrate(){
  const em=['🎉','⛰️','✨','🌟','🎊','🏔️'];
  for(let i=0;i<24;i++){
    const d=document.createElement('div');d.className='confetti';
    d.textContent=em[Math.floor(Math.random()*em.length)];
    d.style.left=Math.random()*100+'vw';d.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3600);
  }
}

/* ---------- 分頁切換 ---------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.tab).classList.add('active');
  if(t.dataset.tab==='progress') renderProgress();
  window.scrollTo({top:0});
}));

function makeChips(container, items, onSelect, initial=0){
  container.innerHTML='';
  items.forEach((label,i)=>{
    const b=document.createElement('button');b.className='chip'+(i===initial?' on':'');b.textContent=label;
    b.onclick=()=>{container.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');onSelect(i);};
    container.appendChild(b);
  });
}

/* ========== 📖 讀課文 ========== */
let readIdx=0;
function renderRead(){
  document.getElementById('readTitle').textContent=TITLES[readIdx];
  const box=document.getElementById('readText');box.innerHTML='';
  clauses(PARAS[readIdx]).forEach(c=>{
    const s=document.createElement('span');s.className='clause';s.textContent=c;
    s.onclick=()=>s.classList.toggle('cover');box.appendChild(s);
  });
}
makeChips(document.getElementById('readParas'),PNAMES,i=>{readIdx=i;renderRead();});
document.getElementById('coverAll').onclick=()=>document.querySelectorAll('#readText .clause').forEach(s=>s.classList.add('cover'));
document.getElementById('showAll').onclick=()=>document.querySelectorAll('#readText .clause').forEach(s=>s.classList.remove('cover'));
renderRead();

/* ========== ✏️ 填空挑戰 ========== */
let clozeIdx=0, clozeLevel=0, cz=null;
makeChips(document.getElementById('clozeParas'),PNAMES,i=>{clozeIdx=i;newCloze();});
makeChips(document.getElementById('clozeLevels'),LEVELS.map(l=>l.name),i=>{clozeLevel=i;newCloze();});
document.getElementById('newCloze').onclick=()=>{newCloze();window.scrollTo({top:0,behavior:'smooth'});};

function newCloze(){
  const text=PARAS[clozeIdx];
  const chars=[...text];
  const candidates=[];chars.forEach((c,i)=>{if(!isPunct(c))candidates.push(i);});
  const n=Math.max(3,Math.round(candidates.length*LEVELS[clozeLevel].r));
  const blankSet=new Set(shuffle([...candidates]).slice(0,n));
  cz={answers:[],filled:[],tiles:[],selected:null,checked:false};
  const box=document.getElementById('clozeText');box.innerHTML='';
  document.getElementById('clozeTitle').textContent=TITLES[clozeIdx]+'　（'+LEVELS[clozeLevel].name+'：'+n+' 格）';
  document.getElementById('clozeResult').innerHTML='';
  let k=0;
  chars.forEach((c,i)=>{
    const s=document.createElement('span');
    if(blankSet.has(i)){
      s.className='blank';s.dataset.i=k;cz.answers.push(c);cz.filled.push(null);
      s.onclick=()=>blankClick(s);k++;
    }else{ s.textContent=c; if(isPunct(c)) s.className='pu'; }
    box.appendChild(s);
  });
  blankEl(0).classList.add('sel');cz.selected=0;
  const allChars=[...strip(PARAS.join(''))];
  const dis=Math.max(3,Math.ceil(n*0.25));
  const tileChars=[...cz.answers];
  for(let i=0;i<dis;i++) tileChars.push(allChars[Math.floor(Math.random()*allChars.length)]);
  shuffle(tileChars);
  const pool=document.getElementById('clozePool');pool.innerHTML='';
  tileChars.forEach((ch,id)=>{
    const t=document.createElement('button');t.className='tile';t.textContent=ch;t.dataset.id=id;
    cz.tiles.push(ch);t.onclick=()=>tileClick(t);pool.appendChild(t);
  });
}
function blankEl(i){return document.querySelector('#clozeText .blank[data-i="'+i+'"]');}
function tileEl(id){return document.querySelector('#clozePool .tile[data-id="'+id+'"]');}
function blankClick(s){
  if(cz.checked) return;
  const i=+s.dataset.i;
  if(cz.filled[i]!==null){
    tileEl(cz.filled[i]).classList.remove('used');cz.filled[i]=null;s.textContent='';
  }
  document.querySelectorAll('#clozeText .blank').forEach(b=>b.classList.remove('sel'));
  s.classList.add('sel');cz.selected=i;
}
function tileClick(t){
  if(cz.checked||t.classList.contains('used')) return;
  let target=cz.selected;
  if(target===null||cz.filled[target]!==null) target=cz.filled.indexOf(null);
  if(target===-1){t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),400);return;}
  const id=+t.dataset.id;
  cz.filled[target]=id;blankEl(target).textContent=cz.tiles[id];t.classList.add('used');
  document.querySelectorAll('#clozeText .blank').forEach(b=>b.classList.remove('sel'));
  cz.selected=null;
  const nxt=cz.filled.indexOf(null);
  if(nxt!==-1){
    const b=blankEl(nxt);b.classList.add('sel');cz.selected=nxt;
    // 若下一個空格被底部字卡區遮住，稍微捲動
    const r=b.getBoundingClientRect(), dock=document.querySelector('#cloze .dock').getBoundingClientRect();
    if(r.bottom>dock.top-10||r.top<70) b.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
document.getElementById('checkCloze').onclick=()=>{
  if(!cz||cz.checked) return;
  let ok=0;
  cz.answers.forEach((a,i)=>{
    const b=blankEl(i);b.classList.remove('sel');
    const ch=cz.filled[i]===null?'':cz.tiles[cz.filled[i]];
    if(ch===a){b.classList.add('ok');ok++;}else{b.classList.add('bad');if(!ch)b.textContent='？';}
  });
  cz.checked=true;
  const pct=Math.round(ok/cz.answers.length*100);
  saveScore('cloze:'+clozeIdx+':'+clozeLevel,pct);
  const r=document.getElementById('clozeResult');
  r.innerHTML='<div class="result'+(pct===100?' great':'')+'"><span class="big">'+pct+' 分</span>　'+stars(pct)+'<br>答對 '+ok+' / '+cz.answers.length+' 格。'+
    (pct===100?'太厲害了！「而山不加增，何苦而不平？」':pct>=70?'不錯！按「顯示答案」看看錯在哪裏，再試更高難度。':'再多讀幾遍課文，然後再挑戰一次吧！')+'</div>';
  scrollTo_(r);
  if(pct===100) celebrate();
};
document.getElementById('revealCloze').onclick=()=>{
  if(!cz) return;
  cz.checked=true;
  cz.answers.forEach((a,i)=>{const b=blankEl(i);b.classList.remove('sel');if(!b.classList.contains('ok')){b.textContent=a;b.classList.remove('bad');b.classList.add('ok');b.style.textDecoration='none';}});
  window.scrollTo({top:0,behavior:'smooth'});
};
newCloze();

/* ========== 🔀 句子排序 ========== */
let orderIdx=0, od=null;
makeChips(document.getElementById('orderParas'),PNAMES,i=>{orderIdx=i;newOrder();});
document.getElementById('newOrder').onclick=newOrder;
function newOrder(){
  const cl=clauses(PARAS[orderIdx]);
  od={cl,next:0,errors:0};
  document.getElementById('orderTitle').textContent=TITLES[orderIdx]+'　（共 '+cl.length+' 句）';
  const ans=document.getElementById('orderAnswer');
  ans.innerHTML='<span style="color:#aaa">（按次序點選下方句子…）</span>';
  document.getElementById('orderResult').innerHTML='';
  const pool=document.getElementById('orderPool');pool.innerHTML='';
  shuffle(cl.map((c,i)=>i)).forEach(i=>{
    const t=document.createElement('button');t.className='ctile';t.textContent=cl[i];
    t.onclick=()=>{
      if(i===od.next){
        if(od.next===0) ans.innerHTML='';
        const s=document.createElement('span');s.className='done';s.textContent=cl[i];
        ans.appendChild(s);ans.scrollTop=ans.scrollHeight;t.remove();od.next++;
        if(od.next===cl.length) finishOrder();
      }else{od.errors++;t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),400);}
    };
    pool.appendChild(t);
  });
}
function finishOrder(){
  const n=od.cl.length;const pct=Math.max(0,Math.round(100-od.errors/n*100));
  saveScore('order:'+orderIdx,pct);
  const r=document.getElementById('orderResult');
  r.innerHTML='<div class="result'+(pct>=90?' great':'')+'"><span class="big">'+pct+' 分</span>　'+stars(pct)+'<br>完成排序！點錯 '+od.errors+' 次。'+(od.errors===0?'一次都沒錯，句序已經牢記在心！':'記住上下文的關係，再試一次會更好。')+'</div>';
  scrollTo_(r);
  if(od.errors===0) celebrate();
}
newOrder();

/* ========== 📝 全文背默 ========== */
let reciteIdx=0, hintOn=false;
makeChips(document.getElementById('reciteParas'),[...PNAMES,'全文'],i=>{reciteIdx=i;renderReciteHead();});
function reciteText(){return reciteIdx===4?PARAS.join(''):PARAS[reciteIdx];}
function renderReciteHead(){
  document.getElementById('reciteTitle').textContent=reciteIdx===4?'全文（四段）':TITLES[reciteIdx];
  document.getElementById('reciteResult').innerHTML='';
  const h=document.getElementById('reciteHint');
  h.style.display=hintOn?'block':'none';
  if(hintOn){
    const src=reciteIdx===4?PARAS:[PARAS[reciteIdx]];
    h.innerHTML=src.map(p=>clauses(p).map(c=>'<b>'+strip(c)[0]+'</b>…').join('　')).join('<br><br>');
  }
}
document.getElementById('toggleHint').onclick=function(){hintOn=!hintOn;this.textContent=hintOn?'🙈 隱藏提示':'💡 顯示每句首字提示';renderReciteHead();};
document.getElementById('clearRecite').onclick=()=>{document.getElementById('reciteInput').value='';document.getElementById('reciteResult').innerHTML='';};

function lcsDiff(a,b){
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const status=new Array(n).fill('miss');const ins=Array.from({length:n+1},()=>[]);
  let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){status[i]='ok';i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){i++;}
    else{ins[i].push(b[j]);j++;}
  }
  while(j<m){ins[i].push(b[j]);j++;}
  return {status,ins,lcs:dp[0][0]};
}
document.getElementById('submitRecite').onclick=()=>{
  const orig=reciteText();const user=document.getElementById('reciteInput').value;
  const a=[...strip(orig)],b=[...strip(user)];
  const r=document.getElementById('reciteResult');
  if(b.length===0){r.innerHTML='<div class="result">請先輸入你背默的內容。</div>';return;}
  document.getElementById('reciteInput').blur();
  const {status,ins,lcs}=lcsDiff(a,b);
  const pct=Math.round(lcs/a.length*100);
  saveScore('recite:'+reciteIdx,pct);
  let html='',k=0;
  const esc=s=>s.replace(/</g,'&lt;');
  for(const c of orig){
    if(isPunct(c)){html+='<span class="pu">'+(c===' '?'&nbsp;':c)+'</span>';continue;}
    if(ins[k].length)html+='<span class="extra">'+esc(ins[k].join(''))+'</span>';
    html+='<span class="'+status[k]+'">'+c+'</span>';k++;
  }
  if(ins[a.length].length)html+='<span class="extra">'+esc(ins[a.length].join(''))+'</span>';
  const miss=a.length-lcs,extra=b.length-lcs;
  r.innerHTML=
    '<div class="result'+(pct>=90?' great':'')+'"><span class="big">'+pct+' 分</span>　'+stars(pct)+
    '<br>正確 '+lcs+' 字／共 '+a.length+' 字<br><span class="miss">遺漏／錯字 '+miss+'</span>　<span class="extra">多餘 '+extra+'</span>'+
    (pct===100?'<br>全對！你已經可以完全背默這段課文了！🎉':pct>=90?'<br>非常接近了，留意紅字部分再默一次。':'<br>先到「填空」和「排序」練熟，再來背默吧。')+
    '</div><div class="textbox" style="margin-top:12px">'+html+'</div>'+
    '<div class="legend"><span class="ok">綠色＝正確</span><span class="miss">紅色＝遺漏或寫錯</span><span class="extra">橙色刪線＝多寫</span></div>';
  scrollTo_(r.firstChild);
  if(pct===100) celebrate();
};
renderReciteHead();

/* ========== 📊 進度 ========== */
function renderProgress(){
  const box=document.getElementById('progressCards');box.innerHTML='';
  const row=(name,key)=>{const s=progress[key];return '<div><span>'+name+'</span><span><span class="stars">'+stars(s)+'</span> '+(s===undefined?'—':s+'分')+'</span></div>';};
  TITLES.forEach((t,i)=>{
    let h='<div class="card"><h3>'+t+'</h3>';
    LEVELS.forEach((l,li)=>h+=row('填空‧'+l.name,'cloze:'+i+':'+li));
    h+=row('句子排序','order:'+i);h+=row('全文背默','recite:'+i);
    box.innerHTML+=h+'</div>';
  });
  box.innerHTML+='<div class="card"><h3>全文</h3>'+row('全文背默','recite:4')+'</div>';
}
document.getElementById('resetProgress').onclick=()=>{
  if(confirm('確定要清除所有紀錄嗎？')){progress={};try{localStorage.removeItem('ygys_progress');}catch(e){}renderProgress();}
};
